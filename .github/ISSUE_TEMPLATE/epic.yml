name: Эпик (Epic)
description: Крупная цель, разбиваемая на подзадачи
title: "[Epic]: "
labels: ["type: epic"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Цель эпика
    validations:
      required: true
  - type: textarea
    id: decomposition
    attributes:
      label: Декомпозиция (Список подзадач)
      placeholder: |
        - [ ] #2 Подзадача 1
        - [ ] #3 Подзадача 2
